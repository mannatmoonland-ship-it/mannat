<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Google Photos Test</title>
<style>
body{font-family:Arial;max-width:700px;margin:50px auto;padding:20px}
input{width:100%;padding:12px;box-sizing:border-box}
button{margin-top:10px;padding:12px 20px}
img{max-width:100%;margin-top:25px}
.error{color:#b00020;margin-top:20px}
header{background:#111827;color:white;padding:18px 28px;display:flex;justify-content:space-between;align-items:center;margin:-50px -20px 30px -20px;padding:20px 28px}
header h2{margin:0;font-size:20px}
header .nav-link{color:#cbd5e1;text-decoration:none;font-size:14px;padding:8px 16px;border-radius:6px;transition:background 0.2s ease,color 0.2s ease}
header .nav-link:hover{background:rgba(255,255,255,0.1);color:white}
</style>
    <link rel="stylesheet" href="{{ url_for('static', filename='design_system.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='site_motion.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='mm_navigation.css') }}">
</head>
<body>
<header>
<h2>Google Photos Image Test</h2>
{% include '_navigation.html' %}
</header>
<form method="post" action="/google-photos">
<input type="hidden" name="csrf_token" value="{{ authenticated_form_csrf_token() }}">
<input name="url" placeholder="Paste Google Photos URL" required>
<button>Get Image</button>
</form>

{% if error %}<div class="error">{{ error }}</div>{% endif %}

{% if image %}
<h3>Preview</h3>
<img src="/image?url={{ image | urlencode }}">
<p><a href="{{ image }}" target="_blank">Open image</a></p>
{% endif %}
</body>
</html>
