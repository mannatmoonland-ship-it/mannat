<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mannat Moon - Ledger Prints</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='ledger_prints.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='design_system.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='site_motion.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='mm_navigation.css') }}">
</head>
<body data-contract-values-csrf="{{ contract_values_csrf }}" data-trade-builder-csrf="{{ trade_builder_csrf }}" data-can-edit-ledger="{{ 'true' if can_edit_ledger else 'false' }}">
  <header class="ledger-header">
    <div>
      <h1>MANNAT MOON</h1>
      <p>Ledger Prints</p>
    </div>
    {% include '_navigation.html' %}
  </header>

  <main class="ledger-main">
    <div class="ledger-toolbar">
      <div>
        <h2>Trade Ledgers</h2>
        <p>View, print, and download trade ledgers.</p>
      </div>
      <label class="search-label" for="tradeSearch">Search trades
        <input id="tradeSearch" type="search" placeholder="Search by trade name" autocomplete="off">
      </label>
    </div>
    <div id="ledgerStatus" class="ledger-status" role="status">Loading trades...</div>
    <section id="tradeList" class="trade-list" aria-live="polite"></section>
  </main>

  <div id="ledgerModal" class="ledger-modal" hidden>
    <div class="ledger-modal-panel" role="dialog" aria-modal="true" aria-labelledby="ledgerModalTitle">
      <div class="modal-heading">
        <h2 id="ledgerModalTitle">Trade Ledger</h2>
        <div class="modal-actions">
          <button id="editLedger" class="action-button secondary" type="button" {% if not can_edit_ledger %}hidden{% endif %}>Edit Ledger</button>
          <button id="downloadModalPdf" class="action-button" type="button">Download PDF</button>
          <button id="closeLedger" class="icon-button" type="button" aria-label="Close ledger">&times;</button>
        </div>
      </div>
      <div id="ledgerPreview" class="ledger-preview"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script type="module" src="{{ url_for('static', filename='ledger_prints.js') }}"></script>
</body>
</html>
