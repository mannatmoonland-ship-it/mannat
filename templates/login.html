<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mannat Moon - Sign In</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
        }
        .login-shell {
            width: min(980px, 100%);
            background: rgba(15, 23, 42, 0.78);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 22px;
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.35);
            padding: 28px;
        }
        .login-layout {
            display: grid;
            grid-template-columns: minmax(250px, 1.15fr) minmax(300px, 1fr);
            gap: 28px;
            align-items: stretch;
        }
        .login-art {
            display: flex;
            align-items: stretch;
            justify-content: center;
            height: 100%;
            min-height: 0;
            padding: 0;
        }
        .login-art img {
            display: block;
            width: 100%;
            max-width: 520px;
            height: 100%;
            max-height: 430px;
            min-height: 260px;
            object-fit: contain;
            border-radius: 18px;
            background: rgba(15, 23, 42, 0.35);
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.3);
        }
        .login-card {
            background: rgba(15, 23, 42, 0.76);
            border: 1px solid rgba(148, 163, 184, 0.16);
            border-radius: 18px;
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }
        h1 { margin: 0 0 8px; font-size: 32px; }
        .subhead { margin: 0 0 20px; color: #94a3b8; }
        .flash {
            margin-bottom: 18px;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 14px;
            border: 1px solid transparent;
        }
        .flash.error { background: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.35); color: #fecaca; }
        .flash.success { background: rgba(34, 197, 94, 0.08); border-color: rgba(34, 197, 94, 0.45); color: #bbf7d0; }
        .flash.warning { background: rgba(245, 158, 11, 0.12); border-color: rgba(245, 158, 11, 0.45); color: #fde68a; }
        form { display: grid; gap: 16px; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; }
        input {
            width: 100%;
            border: 1px solid #475569;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.85);
            color: #f8fafc;
            padding: 12px 14px;
            font-size: 15px;
        }
        .password-input-wrap { position: relative; }
        .password-input-wrap input { padding-right: 46px; }
        .password-toggle {
            position: absolute;
            top: 50%;
            right: 8px;
            display: grid;
            place-items: center;
            width: 32px;
            height: 32px;
            padding: 0;
            transform: translateY(-50%);
            background: transparent;
            color: #cbd5e1;
            border-radius: 7px;
        }
        .password-toggle:hover { background: rgba(148, 163, 184, 0.14); }
        .password-toggle:focus-visible { outline: 2px solid #7dd3fc; outline-offset: 1px; }
        .password-toggle svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .password-toggle .eye-slash { display: none; }
        .password-toggle[aria-pressed="true"] .eye-slash { display: block; }
        button {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            border: none;
            color: white;
            border-radius: 10px;
            padding: 12px 16px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
        }
        .helper-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            margin-top: 12px;
        }
        .helper-row a { color: #7dd3fc; text-decoration: none; }
        @media (max-width: 820px) {
            .login-shell { padding: 22px; }
            .login-layout { grid-template-columns: 1fr; }
            .login-art { min-height: auto; }
            .login-art img { max-height: 280px; min-height: 180px; }
        }
        @media (max-width: 640px) {
            body { padding: 16px; }
            .login-shell { padding: 18px; }
            .login-card { padding: 20px 16px; }
            h1 { font-size: 26px; }
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='design_system.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='site_motion.css') }}">
</head>
<body class="login-page">
    <main class="login-shell">
        <div class="login-layout">
            <div class="login-art" aria-label="Mannat Moon Construction brand panel">
                <img src="{{ url_for('login_asset', filename='image.jpeg') }}" alt="Mannat Moon Construction" />
            </div>

            <section class="login-card" aria-label="Sign in form">
                <h1>Sign In</h1>
                <p class="subhead">Mannat Moon Construction</p>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="flash {{ category }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="post" action="{{ url_for('login_page') }}">
                    <div>
                        <label for="username">Username</label>
                        <input id="username" name="username" type="text" required autofocus>
                    </div>
                    <div>
                        <label for="password">Password</label>
                        <div class="password-input-wrap">
                            <input id="password" name="password" type="password" required>
                            <button class="password-toggle" id="passwordToggle" type="button" aria-label="Show password" title="Show password" aria-pressed="false">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"></path>
                                    <circle cx="12" cy="12" r="2.5"></circle>
                                    <path class="eye-slash" d="m4 4 16 16"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit">Sign In</button>
                </form>

                <div class="helper-row">
                    <a href="{{ url_for('password_reset_request') }}">Forgot Password?</a>
                    <a href="{{ url_for('super_admin_recovery') }}">Super Admin recovery</a>
                </div>
            </section>
        </div>
    </main>
    <script>
        const passwordInput = document.getElementById("password");
        const passwordToggle = document.getElementById("passwordToggle");

        passwordToggle.addEventListener("click", () => {
            const isVisible = passwordInput.type === "password";
            passwordInput.type = isVisible ? "text" : "password";
            const label = isVisible ? "Hide password" : "Show password";
            passwordToggle.setAttribute("aria-label", label);
            passwordToggle.setAttribute("title", label);
            passwordToggle.setAttribute("aria-pressed", String(isVisible));
        });
    </script>
</body>
</html>
