<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mannat Moon - Reset Password</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; color: #e2e8f0; background: linear-gradient(135deg, #0f172a, #1e293b); font-family: Arial, Helvetica, sans-serif; }
        .card { width: min(440px, 100%); padding: 28px; border: 1px solid rgba(148, 163, 184, .25); border-radius: 18px; background: rgba(15, 23, 42, .88); box-shadow: 0 18px 45px rgba(15, 23, 42, .35); }
        h1 { margin: 0 0 8px; font-size: 27px; }
        .brand { margin: 0 0 22px; color: #94a3b8; }
        .hint { color: #cbd5e1; font-size: 14px; line-height: 1.5; }
        label { display: block; margin: 18px 0 6px; color: #cbd5e1; font-size: 13px; }
        input { width: 100%; padding: 12px 14px; border: 1px solid #475569; border-radius: 9px; color: #f8fafc; background: rgba(15, 23, 42, .85); font: inherit; }
        button { width: 100%; margin-top: 16px; padding: 12px 16px; border: 0; border-radius: 10px; color: white; background: linear-gradient(135deg, #0ea5e9, #0284c7); font-size: 15px; font-weight: 600; cursor: pointer; }
        button:disabled { opacity: .6; cursor: wait; }
        .flash, .status { margin: 14px 0; padding: 11px 12px; border: 1px solid rgba(34, 197, 94, .45); border-radius: 9px; color: #bbf7d0; background: rgba(34, 197, 94, .08); font-size: 14px; }
        .flash.error, .status.error { border-color: rgba(239, 68, 68, .45); color: #fecaca; background: rgba(239, 68, 68, .12); }
        .back { display: inline-block; margin-top: 18px; color: #7dd3fc; font-size: 13px; text-decoration: none; }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='design_system.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='site_motion.css') }}">
</head>
<body>
    <main class="card" id="resetPage"
          data-user-id="{{ user_id }}"
          data-validation-url="{{ url_for('validate_password_reset_link', user_id=user_id) }}"
          data-csrf-token="{{ csrf_token }}"
          data-invalid-link="{{ 'true' if invalid_link else 'false' }}">
        <h1>Reset Password</h1>
        <p class="brand">Mannat Moon Construction</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}" role="{{ 'alert' if category == 'error' else 'status' }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <p class="status" id="resetStatus" role="status" aria-live="polite">Checking reset link...</p>
        <form id="resetForm" method="post" hidden>
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="token" id="resetToken">
            <label for="new_password">New Password</label>
            <input id="new_password" name="new_password" type="password" autocomplete="new-password" required>
            <label for="confirm_password">Confirm New Password</label>
            <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>
            <button type="submit">Reset Password</button>
        </form>
        <a class="back" href="{{ url_for('login_page') }}">Back to Sign In</a>
    </main>
    <script>
        (() => {
            const page = document.getElementById("resetPage");
            const status = document.getElementById("resetStatus");
            const form = document.getElementById("resetForm");
            if (page.dataset.invalidLink === "true") {
                status.textContent = "This reset link is invalid or expired. Request a new reset link.";
                status.classList.add("error");
                return;
            }

            const token = window.location.hash.slice(1);
            window.history.replaceState(null, "", window.location.pathname);
            if (!token) {
                status.textContent = "This reset link is invalid or expired. Request a new reset link.";
                status.classList.add("error");
                return;
            }
            document.getElementById("resetToken").value = token;

            fetch(page.dataset.validationUrl, {
                method: "POST",
                credentials: "same-origin",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token, csrf_token: page.dataset.csrfToken })
            }).then(response => {
                if (!response.ok) throw new Error("invalid");
                status.remove();
                form.hidden = false;
            }).catch(() => {
                status.textContent = "This reset link is invalid or expired. Request a new reset link.";
                status.classList.add("error");
            });
        })();
    </script>
</body>
</html>
